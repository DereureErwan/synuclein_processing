defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "deepclusterv2-protein_aggregates_blurred_labeled_4-linear"
pretrained_feature_extractor: "/workspaces/mcbs/dereure/solo-learn/trained_models/deepclusterv2/7xvtdrtc"
backbone:
  name: "vit_base"
pretrain_method: "deepclusterv2"
data:
  dataset: custom
  train_path: "/data/mcbs/dereure/DeepCellMap_VF/data/parkinson_disease/protein_aggregates_blurred_labeled_4/train"
  val_path: "/data/mcbs/dereure/DeepCellMap_VF/data/parkinson_disease/protein_aggregates_blurred_labeled_4/test"
  format: "image_folder"
  num_workers: 4
optimizer:
  name: adamw
  batch_size: 16
  lr: 1e-3
  weight_decay: 1e-4
scheduler:
  name: warmup_cosine
  warmup_start_lr: 1e-5
  warmup_epochs: 1     # instead of 5
  max_epochs: 50
checkpoint:
  enabled: True
  dir: "trained_models"
  frequency: 1
auto_resume:
  enabled: True

# overwrite PL stuff
max_epochs: 100
devices: [0]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16
