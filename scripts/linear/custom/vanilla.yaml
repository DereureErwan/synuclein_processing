defaults:
  - _self_
  - wandb: private.yaml
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# disable hydra outputs
hydra:
  output_subdir: null
  run:
    dir: .

name: "name_of_your_experiment"
backbone:
  name: "resnet50"
  kwargs:
    pretrained: True
pretrain_method: "deepclusterv2"
data:
  dataset: custom
  train_path: "path/to/train/data"
  val_path: "path/to/val/data"
  format: "image_folder"
  num_workers: 4
optimizer:
  batch_size: 32
  name: "adamw"
  lr: 1e-4
  # momentum: 0.9
  weight_decay: 1e-4
scheduler:
  name: "warmup_cosine"
  warmup_epochs: 10
  max_epochs: 60
  warmup_start_lr: 1e-7
checkpoint:
  enabled: True
  dir: "path/to/save/checkpoints"
  frequency: 1
auto_resume:
  enabled: False

# overwrite PL stuff
label_smoothing: 0.1
max_epochs: 60
devices: [0]
sync_batchnorm: True
accelerator: "gpu"
strategy: "ddp"
precision: 16
finetune: True
